name: Global Knowledge Notion Sync

on:
  workflow_dispatch:
  # Schedule trigger removed 2026-08-21: this drain now runs from the
  # skale-cron service on the Coolify VPS, which has been firing it reliably
  # for hours with heartbeats reporting in and alerting verified end-to-end
  # (a real alert email was delivered when a job went silent). GitHub Actions
  # billed a full minute of runner time per invocation for a curl that only
  # takes 7-47s, and its shared runners were throttling this */5 * * * *
  # schedule into 28-37 minute gaps in practice — the VPS crontab does not
  # have that throttling problem. The Cloudflare 524 workaround below (pin
  # to origin.xphere.app, skip the edge) still applies unchanged since this
  # drain can still run 88-103s regardless of which scheduler fires it.
  # workflow_dispatch stays as the manual/emergency trigger for if the VPS
  # is ever down.

concurrency:
  group: global-knowledge-notion-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Drain durable Notion sync queue
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="${SITE_URL:-https://xphere.app}/api/cron/global-knowledge-notion"

          # This drain regularly runs 88-103s. Cloudflare's proxy drops any
          # origin request that takes over 100s (524), so we pin the request
          # to the origin IP and skip the edge. Host header and TLS SNI stay
          # unchanged, so Traefik routes it and the cert still validates.
          # See docs/ops/cloudflare-cdn.md.
          HOST=$(echo "$URL" | sed -E 's#^https?://([^/]+).*#\1#')
          ORIGIN_IP=$(getent hosts origin.xphere.app | awk '{print $1; exit}')
          RESOLVE=""
          if [ -n "$ORIGIN_IP" ]; then
            RESOLVE="--resolve ${HOST}:443:${ORIGIN_IP}"
          else
            echo "WARNING: origin.xphere.app did not resolve — falling back to the edge (524 risk)"
          fi

          curl --fail --silent --show-error $RESOLVE \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$URL"
