name: Coolify — Set Runtime Env Vars

# Ops utility: pushes selected runtime environment variables into the Coolify
# Xphere application via the Coolify API, then triggers a redeploy so the new
# values take effect. Runs only on manual dispatch.
#
# Why this exists: Coolify runtime env vars are NOT managed by build-deploy.yml
# (which only passes NEXT_PUBLIC_* build args). The Active Prospect System needs
# SKALECLUB_WEBSITES_URL + SKALECLUB_WEBSITES_API_KEY at runtime to call the
# preview generator. This workflow keeps those in sync from GitHub Secrets
# without exposing the Coolify token to anyone.

on:
  workflow_dispatch: {}

env:
  APP_UUID: fwjo7xriuqibl01v96vah7fz
  COOLIFY_BASE: https://coolify.skale.club

jobs:
  set-envs:
    runs-on: ubuntu-latest
    steps:
      - name: Push env vars to Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          WEBSITES_URL: ${{ secrets.SKALECLUB_WEBSITES_URL }}
          WEBSITES_API_KEY: ${{ secrets.SKALECLUB_WEBSITES_API_KEY }}
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          NOTION_WEBHOOK_VERIFICATION_TOKEN: ${{ secrets.NOTION_WEBHOOK_VERIFICATION_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAPI_WEBHOOK_SECRET: ${{ secrets.VAPI_WEBHOOK_SECRET }}
          XMAIL_API_URL: ${{ secrets.XMAIL_API_URL }}
          XMAIL_USER_ID: ${{ secrets.XMAIL_USER_ID }}
          XMAIL_ORG_ID: ${{ secrets.XMAIL_ORG_ID }}
          XMAIL_SERVICE_KEY: ${{ secrets.XMAIL_SERVICE_KEY }}
          MILLIONVERIFIER_API_KEY: ${{ secrets.MILLIONVERIFIER_API_KEY }}
          NEVERBOUNCE_API_KEY: ${{ secrets.NEVERBOUNCE_API_KEY }}
          # Ops alerting. The same pair is also read directly by uptime.yml,
          # which runs on the GitHub runner and therefore does NOT need them
          # here — these two are for the in-app half (src/lib/obs/alerts.ts),
          # which runs in the container and only sees Coolify's runtime env.
          # See docs/ops/TELEGRAM-ALERTS.md.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::error::COOLIFY_TOKEN secret not set"; exit 1
          fi

          API="${COOLIFY_BASE}/api/v1/applications/${APP_UUID}/envs"

          # upsert <key> <value>: PATCH (update) first; if the key doesn't
          # exist yet, the API returns non-2xx and we POST (create) instead.
          upsert() {
            local key="$1" value="$2"
            local body
            body=$(printf '{"key":"%s","value":"%s","is_preview":false,"is_literal":true}' "$key" "$value")

            echo "==> PATCH $key"
            local code
            code=$(curl -s -o /tmp/patch_out -w "%{http_code}" -X PATCH "$API" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$body")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "    updated ($code)"; return 0
            fi

            echo "    PATCH returned $code — trying POST (create)"
            code=$(curl -s -o /tmp/post_out -w "%{http_code}" -X POST "$API" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$body")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "    created ($code)"; return 0
            fi
            echo "::error::failed to upsert $key (POST $code): $(cat /tmp/post_out)"
            return 1
          }

          upsert SKALECLUB_WEBSITES_URL     "${WEBSITES_URL}"
          upsert SKALECLUB_WEBSITES_API_KEY "${WEBSITES_API_KEY}"
          upsert NOTION_CLIENT_ID                    "${NOTION_CLIENT_ID}"
          upsert NOTION_CLIENT_SECRET                "${NOTION_CLIENT_SECRET}"
          upsert NOTION_WEBHOOK_VERIFICATION_TOKEN  "${NOTION_WEBHOOK_VERIFICATION_TOKEN}"
          upsert CRON_SECRET                         "${CRON_SECRET}"
          upsert VAPI_WEBHOOK_SECRET                 "${VAPI_WEBHOOK_SECRET}"
          upsert XMAIL_API_URL                       "${XMAIL_API_URL}"
          upsert XMAIL_USER_ID                        "${XMAIL_USER_ID}"
          upsert XMAIL_ORG_ID                         "${XMAIL_ORG_ID}"
          upsert XMAIL_SERVICE_KEY                    "${XMAIL_SERVICE_KEY}"
          upsert MILLIONVERIFIER_API_KEY              "${MILLIONVERIFIER_API_KEY}"
          upsert NEVERBOUNCE_API_KEY                  "${NEVERBOUNCE_API_KEY}"
          upsert TELEGRAM_BOT_TOKEN                   "${TELEGRAM_BOT_TOKEN}"
          upsert TELEGRAM_ALERT_CHAT_ID               "${TELEGRAM_ALERT_CHAT_ID}"

          echo "==> Triggering redeploy so new env vars take effect"
          curl --fail-with-body -sS --retry 3 --retry-all-errors --request POST \
            "${COOLIFY_BASE}/api/v1/deploy?uuid=${APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
          echo
          echo "Done. Coolify will restart Xphere with the new runtime env."
