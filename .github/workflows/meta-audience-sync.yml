name: Meta Custom Audience Sync

# Hourly recovery reconciliation for enabled tenant-owned audiences.
# Tenant OAuth tokens are decrypted only at execution time; no global Meta
# system-user token is required for this workflow.

on:
  workflow_dispatch:
    inputs:
      org_id:
        description: 'Constrain the run to one organization (optional)'
        required: false
      audience_id:
        description: 'Constrain the run to one audience config (optional)'
        required: false
      dry_run:
        description: 'Compute the exact diff without Graph or ledger mutation'
        type: boolean
        default: false
  schedule:
    - cron: '15 * * * *'

concurrency:
  group: meta-audience-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Reconcile tenant audiences
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate required configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
        run: |
          missing=""
          for key in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY ENCRYPTION_SECRET; do
            eval "value=\${$key}"
            if [ -z "$value" ]; then missing="$missing $key"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required configuration:$missing"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Reconcile Meta audiences
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
          ORG_ID: ${{ inputs.org_id }}
          AUDIENCE_ID: ${{ inputs.audience_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$ORG_ID" ]; then args+=(--org "$ORG_ID"); fi
          if [ -n "$AUDIENCE_ID" ]; then args+=(--audience "$AUDIENCE_ID"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npx tsx scripts/meta-audience-sync.ts "${args[@]}"
