name: Scrape Google Reviews (SerpAPI)

# Daily scrape of every active google_business_profile, plus manual
# workflow_dispatch with optional ?force=1 (bypass scrape_interval_hours)
# and ?profileId=... (scrape one profile only).
#
# Required GitHub repo secrets:
#   OPERATOR_BASE_URL              e.g. https://xphere.app  (Coolify production)
#   OPERATOR_AUTOMATION_SECRET     matches OPERATOR_AUTOMATION_SECRET env var on Coolify

on:
  # Schedule trigger removed 2026-08-21: this scrape now runs from the
  # skale-cron service on the Coolify VPS, which has been firing it reliably
  # for hours with heartbeats reporting in and alerting verified end-to-end
  # (a real alert email was delivered when a job went silent). This job was
  # only daily (0 6 * * *), but it was migrated together with a batch of
  # sibling GitHub Actions ticks whose */5 * * * * schedules GitHub was
  # throttling into 28-37 minute gaps in practice; every job in that batch,
  # daily or not, also paid a full billed runner-minute per invocation for a
  # curl that only takes 7-47s (95s for this one, per the Cloudflare 524
  # note below). The VPS crontab has neither problem. The Cloudflare 524
  # workaround (pin to origin.xphere.app, skip the edge) still applies
  # unchanged. workflow_dispatch stays as the manual/emergency trigger,
  # including the force and profile_id inputs, for if the VPS is ever down.
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass scrape_interval_hours (?force=1)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      profile_id:
        description: 'Optional: scrape only this profile_id'
        required: false
        default: ''
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/reviews/scrape
        env:
          FORCE_FLAG: ${{ github.event.inputs.force || 'false' }}
          PROFILE_ID: ${{ github.event.inputs.profile_id || '' }}
        run: |
          QS=""
          if [ "$FORCE_FLAG" = "true" ]; then
            QS="?force=1"
          fi
          if [ -n "$PROFILE_ID" ]; then
            if [ -z "$QS" ]; then QS="?"; else QS="$QS&"; fi
            QS="${QS}profileId=${PROFILE_ID}"
          fi
          URL="${{ secrets.OPERATOR_BASE_URL }}/api/reviews/scrape${QS}"
          echo "POSTing to: $URL"

          # The scrape loops every active profile before responding and has
          # already hit 95s. Cloudflare's proxy drops origin requests over
          # 100s (524), so pin to the origin IP and skip the edge. Host header
          # and TLS SNI are unchanged, so Traefik routes it and the cert still
          # validates. See docs/ops/cloudflare-cdn.md.
          HOST=$(echo "$URL" | sed -E 's#^https?://([^/]+).*#\1#')
          ORIGIN_IP=$(getent hosts origin.xphere.app | awk '{print $1; exit}')
          RESOLVE=""
          if [ -n "$ORIGIN_IP" ]; then
            RESOLVE="--resolve ${HOST}:443:${ORIGIN_IP}"
          else
            echo "WARNING: origin.xphere.app did not resolve — falling back to the edge (524 risk)"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST $RESOLVE \
            "$URL" \
            -H "Authorization: Bearer ${{ secrets.OPERATOR_AUTOMATION_SECRET }}" \
            -H "Content-Type: application/json")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "HTTP Status: $STATUS"
          echo "Response Body: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "Scrape endpoint returned non-200 — failing the job"
            exit 1
          fi
