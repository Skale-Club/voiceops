name: Calendar Tick

# Drives time-based workflow triggers (SEED-027 Phase C):
#   - meeting.starts_in (-5m, -1h, -24h, -2d reminders)
#   - meeting.ended
#
# Moved off Vercel Cron (Hobby plan caps frequency at 1/day) onto
# GitHub Actions. The endpoint is idempotent: scheduled_workflow_ticks
# has a UNIQUE (workflow_id, booking_id, event, fired_minute) so
# duplicate firings are dropped at the DB level.

on:
  # Schedule trigger removed 2026-08-21: this tick now runs from the
  # skale-cron service on the Coolify VPS, which has been firing it reliably
  # for hours with heartbeats reporting in and alerting verified end-to-end
  # (a real alert email was delivered when a job went silent). GitHub Actions
  # billed a full minute of runner time per invocation for a curl that only
  # takes 7-47s, and its shared runners were throttling this */5 * * * *
  # schedule into 28-37 minute gaps in practice — well past the 5-minute
  # window this endpoint's idempotency table (see route.ts) was sized to
  # tolerate for the -5m meeting.starts_in offset. The VPS crontab does not
  # have that throttling problem. workflow_dispatch stays as the
  # manual/emergency trigger for if the VPS is ever down.
  workflow_dispatch:        # manual trigger

concurrency:
  group: calendar-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fire calendar-tick endpoint
        run: |
          STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
            --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/calendar-tick")
          echo "Status: $STATUS"
          echo "Body: $(cat /tmp/body)"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "OK"
          else
            echo "Tick failed with status $STATUS" >&2
            exit 1
          fi
