name: Website Analyzer Cron

# Processes pending/stale website analyses for prospect accounts (up to 10/run).
# Fires every 10 minutes so newly-ingested prospects get analyzed promptly.

on:
  # Schedule trigger removed 2026-08-21: this cron now runs from the
  # skale-cron service on the Coolify VPS, which has been firing it reliably
  # for hours with heartbeats reporting in and alerting verified end-to-end
  # (a real alert email was delivered when a job went silent). GitHub Actions
  # billed a full minute of runner time per invocation for a curl that only
  # takes 7-47s, and its shared runners were throttling schedules like this
  # one into 28-37 minute gaps in practice instead of the configured
  # interval — the VPS crontab does not have that throttling problem.
  # workflow_dispatch stays as the manual/emergency trigger for if the VPS
  # is ever down.
  workflow_dispatch:          # manual trigger

concurrency:
  group: website-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire website-analyzer endpoint
        run: |
          STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
            --connect-timeout 15 --max-time 60 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/website-analyzer")
          echo "Status: $STATUS"
          echo "Body: $(cat /tmp/body)"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "OK"
          else
            echo "website-analyzer cron failed with status $STATUS" >&2
            exit 1
          fi
