name: Twilio SMS Reconcile

# Safety net for inbound SMS webhooks. Twilio is the source of truth for
# received messages; this job backfills any recent inbound MessageSid that did
# not land in conversation_messages because of a transient webhook/app failure.

on:
  # Schedule trigger removed 2026-08-21: this reconcile now runs from the
  # skale-cron service on the Coolify VPS, which has been firing it reliably
  # for hours with heartbeats reporting in and alerting verified end-to-end
  # (a real alert email was delivered when a job went silent). GitHub Actions
  # billed a full minute of runner time per invocation for a curl that only
  # takes 7-47s, and its shared runners were throttling this */5 * * * *
  # schedule into 28-37 minute gaps in practice — the VPS crontab does not
  # have that throttling problem. The 180-minute lookbackMinutes below stays
  # as-is regardless: it's sized to survive multiple missed/delayed runs,
  # not tied to the old GitHub cadence. workflow_dispatch stays as the
  # manual/emergency trigger for if the VPS is ever down.
  workflow_dispatch: {}

concurrency:
  group: twilio-sms-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reconcile inbound Twilio SMS
        run: |
          STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
            --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/twilio-sms-reconcile?lookbackMinutes=180&maxPagesPerNumber=5")
          echo "Status: $STATUS"
          echo "Body: $(cat /tmp/body)"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "OK"
          else
            echo "Twilio SMS reconcile failed with status $STATUS" >&2
            exit 1
          fi
